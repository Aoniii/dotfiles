# Indentation
indent_with_tabs        = 2       # tabs only (indent + align)
indent_columns          = 4
output_tab_size         = 4
input_tab_size          = 4
code_width              = 80
nl_max                  = 2       # max 1 empty line

# Declaration alignment: tabs only, '*' part of the name
align_var_def_span      = 1
align_var_def_star_style = 1
align_var_def_amp_style  = 1
align_var_struct_span   = 1
align_func_proto_span   = 1
align_with_tabs         = true
align_on_tabstop        = true
align_keep_tabs         = false

# Pointers: int *p
sp_before_ptr_star      = add
sp_after_ptr_star       = remove

# Braces attached
nl_fdef_brace           = remove
nl_if_brace             = remove
nl_for_brace            = remove
nl_while_brace          = remove
nl_else_brace           = remove
nl_brace_else           = remove
nl_struct_brace         = remove

# Space before parens: if (x), f(x)
sp_before_sparen        = add
sp_func_call_paren      = remove
sp_func_def_paren       = remove
sp_func_proto_paren     = remove
sp_fparen_brace         = add     # main(void) {
sp_sparen_brace         = add     # if (x) {
sp_else_brace           = add
sp_brace_else           = add
align_func_proto_star_style = 1   # char	**ft_split(...)
align_func_proto_amp_style  = 1

# return (x);
mod_paren_on_return     = add
sp_return_paren         = add

# Continuation lines: one tab, no alignment on the open paren
indent_func_call_param  = true
indent_func_def_param   = true
indent_func_proto_param = true
indent_continue         = 4

# Function definitions: one space between return type and name
sp_type_func            = force

# Includes: sorted, <system> before "local", per block (empty line = new block)
mod_sort_include        = true
mod_sort_incl_import_prioritize_angle_over_quotes = true

# Preprocessor: "# define" inside the header guard
pp_indent               = remove
pp_indent_in_guard      = true
pp_space_after          = add
pp_space_count          = 1

# Defines aligned per group (empty line = new group)
align_pp_define_span    = 1
align_pp_define_together = false
align_pp_define_gap     = 2

# Enums: values and '=' aligned per group
align_enum_equ_span     = 1
nl_enum_brace           = remove
sp_enum_brace           = add
sp_brace_typedef        = add
